<!DOCTYPE html>
<html lang="tg" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистратсия - Akel Cargo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --radius: 12px;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-container { width: 100%; max-width: 440px; }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); margin-bottom: 24px; }
        .logo-icon { width: 48px; height: 48px; background: var(--gradient); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; font-weight: 800; }
        .logo-text { font-size: 24px; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-header h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .auth-header p { color: var(--text-secondary); font-size: 15px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
        .form-group input { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; background: var(--bg); color: var(--text); transition: all 0.2s; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--gradient); color: white; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5); }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-secondary); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--text-secondary); text-decoration: none; font-size: 14px; margin-bottom: 24px; }
        .back-link:hover { color: var(--primary); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 14px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px; font-size: 14px; animation: slideIn 0.3s ease; }
        .toast.success { border-left: 4px solid #22c55e; }
        .toast.error { border-left: 4px solid #ef4444; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .lang-dropdown { position: fixed; top: 20px; right: 70px; }
        .lang-toggle { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .lang-menu { position: absolute; top: 100%; right: 0; margin-top: 4px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; display: none; min-width: 150px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 100; }
        .lang-menu.show { display: block; }
        .lang-option { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .lang-option:hover { background: var(--bg-secondary); }
        .lang-option.active { background: rgba(37, 99, 235, 0.1); color: var(--primary); }
        .password-strength { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .password-strength-fill { height: 100%; border-radius: 2px; transition: all 0.3s; }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    
    <div class="lang-dropdown">
        <button class="lang-toggle" onclick="toggleLangMenu()">🌐</button>
        <div class="lang-menu" id="langMenu">
            <div class="lang-option active" onclick="setLang('tg')">🇹🇯 Тоҷикӣ</div>
            <div class="lang-option" onclick="setLang('ru')">🇷🇺 Русский</div>
            <div class="lang-option" onclick="setLang('en')">🇬🇧 English</div>
        </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="auth-container">
        <a href="/" class="back-link">← <span>Ба саҳифаи асосӣ</span></a>
        
        <div class="auth-header">
            <a href="/" class="logo">
                <div class="logo-icon">A</div>
                <span class="logo-text">Akel Cargo</span>
            </a>
            <h1 data-i18n="auth.registerTitle">Регистратсия</h1>
            <p data-i18n="auth.registerSubtitle">Ҳисоби нав созед</p>
        </div>
        
        <div class="auth-card">
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label data-i18n="auth.fullName">Номи пурра</label>
                    <input type="text" name="full_name" required placeholder="">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="auth.phone">Телефон</label>
                        <input type="tel" name="phone" required placeholder="+992">
                    </div>
                    <div class="form-group">
                        <label data-i18n="auth.email">Email (ихтиёрӣ)</label>
                        <input type="email" name="email" placeholder="">
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="auth.login">Логин</label>
                    <input type="text" name="login" required autocomplete="username" placeholder="">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="auth.password">Парол</label>
                        <input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="" oninput="checkPasswordStrength(this)">
                        <div class="password-strength">
                            <div class="password-strength-fill" id="passwordStrength"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Тасдиқи парол</label>
                        <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password" placeholder="">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" data-i18n="auth.registerBtn">Сабти ном</button>
            </form>
        </div>
        
        <div class="auth-footer">
            <span data-i18n="auth.haveAccount">Аллакай ҳисоб доред?</span>
            <a href="/login" data-i18n="auth.loginHere">Инҷо ворид шавед</a>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
    <script>
        function checkPasswordStrength(input) {
            const fill = document.getElementById('passwordStrength');
            const val = input.value;
            let strength = 0;
            if (val.length >= 6) strength += 25;
            if (val.length >= 8) strength += 25;
            if (/[A-Z]/.test(val)) strength += 25;
            if (/[0-9!@#$%^&*]/.test(val)) strength += 25;
            
            fill.style.width = strength + '%';
            if (strength <= 25) fill.style.background = '#ef4444';
            else if (strength <= 50) fill.style.background = '#f59e0b';
            else if (strength <= 75) fill.style.background = '#3b82f6';
            else fill.style.background = '#22c55e';
        }
    </script>
</body>
</html>
